<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTA - Sistem Informasi Bahan Ajar UT</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
</head>
<body>
  <div id="app" v-cloak>

    <!-- HALAMAN LOGIN -->
    <section v-if="!isAuthenticated" class="login-page">
      <div class="login-decoration login-decoration-one"></div>
      <div class="login-decoration login-decoration-two"></div>

      <div class="login-card">
        <div class="login-brand">
          <div class="brand-mark login-mark">UT</div>
          <div>
            <strong>SITTA</strong>
            <small>Universitas Terbuka</small>
          </div>
        </div>

        <div class="login-heading">
          <p class="eyebrow">SISTEM INFORMASI BAHAN AJAR</p>
          <h1>Selamat datang</h1>
          <p>Silakan login untuk mengakses dashboard SITTA.</p>
        </div>

        <form class="login-form" @submit.prevent="login">
          <div class="field">
            <label for="login-username">Username / Email</label>
            <input
              id="login-username"
              v-model.trim="loginForm.username"
              type="email"
              placeholder="nama@ut.ac.id"
              autocomplete="username"
              required
            >
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              v-model="loginForm.password"
              type="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              required
            >
          </div>

          <p v-if="loginError" class="login-error" role="alert">{{ loginError }}</p>

          <button class="btn btn-primary login-submit" type="submit" :disabled="loginLoading">
            {{ loginLoading ? 'Memeriksa akun...' : 'Login ke SITTA' }}
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <div class="login-footer">
          <span class="online-dot"></span>
          Akses khusus pengguna SITTA
        </div>
      </div>
    </section>

    <!-- APLIKASI SITTA (HANYA TAMPIL SETELAH LOGIN) -->
    <template v-else>
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">UT</div>
          <div><strong>SITTA</strong><small>Sistem Informasi Tiras dan Transaksi Bahan Ajar</small></div>
        </div>
        <div class="top-meta top-account">
          <span class="online-dot"></span>
          {{ loginForm.username }}
          <button class="btn btn-logout" @click="logout">Keluar</button>
        </div>
      </header>

      <div class="shell">
        <aside class="sidebar">
          <div class="side-label">MENU UTAMA</div>
          <button class="nav-link" :class="{active: tab === 'stok'}" @click="tab='stok'">
            <span class="nav-icon">▦</span> Stok Bahan Ajar
          </button>
          <button class="nav-link" :class="{active: tab === 'tracking'}" @click="tab='tracking'">
            <span class="nav-icon">⇢</span> Tracking DO
          </button>
          <div class="side-note">
            <span class="side-note-icon">✦</span>
            <strong>Informasi</strong>
            <p>Kelola persediaan dan pantau pengiriman bahan ajar Universitas Terbuka.</p>
          </div>
          <div class="side-footer">Praktik 3 · Vue.js</div>
        </aside>

        <main class="main-content">
          <div class="page-heading">
            <div>
              <p class="eyebrow">UNIVERSITAS TERBUKA / SITTA</p>
              <h1>{{ tab === 'stok' ? 'Stok Bahan Ajar' : 'Tracking Delivery Order' }}</h1>
              <p class="subtitle">{{ tab === 'stok' ? 'Pantau dan kelola persediaan bahan ajar di seluruh UPBJJ.' : 'Cari status pengiriman dan kelola perjalanan Delivery Order.' }}</p>
            </div>
            <div class="date-chip">● {{ todayLabel }}</div>
          </div>

          <div v-if="loading" class="loading-state">
            <span class="loading-spinner"></span> Memuat data SITTA...
          </div>

          <div v-else-if="loadError" class="error-state">
            <strong>Gagal memuat aplikasi</strong>
            <p>{{ loadError }}</p>
            <button class="btn btn-primary" @click="loadApp">Coba Lagi</button>
          </div>

          <ba-stock-table v-else-if="tab === 'stok'" :stocks="stocks" :upbjj-list="upbjjList"
            :kategori-list="kategoriList" @add="addStock" @update="updateStock" @remove="removeStock">
          </ba-stock-table>

          <do-tracking v-else-if="tab === 'tracking'" :tracking="tracking" :packages="packages" :upbjj-list="upbjjList"
            @add-do="addDO" @add-progress="addProgress">
          </do-tracking>

          <footer class="app-footer">© {{ currentYear }} SITTA · Simulasi aplikasi pemesanan bahan ajar Universitas Terbuka</footer>
        </main>
      </div>
    </template>
  </div>

  <!-- Template komponen dimuat sebelum komponen Vue ditampilkan -->
  <div id="template-host" hidden></div>

  <script src="js/services/api.js"></script>
  <script src="js/components/status-badge.js"></script>
  <script src="js/components/app-modal.js"></script>
  <script src="js/components/stock-table.js"></script>
  <script src="js/components/do-tracking.js"></script>
  <script src="js/components/order-form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
